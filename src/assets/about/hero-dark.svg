<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="1000" viewBox="0 0 3000 1000"><style> .kf-scan{animation:kfScan 8s linear infinite}
.kf-pulse{transform-box:fill-box;transform-origin:center;animation:kfPulse 2.8s ease-out infinite}
.kf-pulse.d2{animation-delay:.6s}.kf-pulse.d3{animation-delay:1.2s}.kf-pulse.d4{animation-delay:1.8s}.kf-pulse.d5{animation-delay:.9s}
.kf-flow{animation:kfFlow 3.2s linear infinite}
@keyframes kfScan{0%{transform:translateY(560px);opacity:0}8%{opacity:1}85%{opacity:1}100%{transform:translateY(20px);opacity:0}}
@keyframes kfPulse{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.6);opacity:0}}
@keyframes kfFlow{to{stroke-dashoffset:-60}}
.kf-up{transform-box:fill-box;animation:kfUp 5s ease-in infinite;opacity:0}
.kf-up.u2{animation-delay:1s}.kf-up.u3{animation-delay:2s}.kf-up.u4{animation-delay:3s}.kf-up.u5{animation-delay:4s}.kf-up.u6{animation-delay:2.5s}
@keyframes kfUp{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-160px);opacity:0}}
.kf-trace{animation:kfFlow 2.4s linear infinite}
.kf-blink{animation:kfBlink 2.2s ease-in-out infinite}.kf-blink.b2{animation-delay:.7s}.kf-blink.b3{animation-delay:1.4s}
